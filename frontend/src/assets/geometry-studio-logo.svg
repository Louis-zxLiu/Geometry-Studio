<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Geometry Studio</title>
  <desc id="desc">A G-shaped geometric logo with aligned construction points and angle lines.</desc>
  <defs>
    <linearGradient id="paper" x1="180" y1="132" x2="850" y2="908" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.56" stop-color="#F8F7F6"/>
      <stop offset="1" stop-color="#E9E7E2"/>
    </linearGradient>
    <radialGradient id="lift" cx="34%" cy="26%" r="68%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#2C2C2C" stop-opacity="0.06"/>
    </radialGradient>
    <filter id="soft-shadow" x="-12%" y="-10%" width="124%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#342C1E" flood-opacity="0.16"/>
    </filter>
    <filter id="stroke-lift" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#342C1E" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="74" y="74" width="876" height="876" rx="210" fill="url(#paper)" filter="url(#soft-shadow)"/>
  <rect x="74" y="74" width="876" height="876" rx="210" fill="url(#lift)"/>

  <g opacity="0.62">
    <circle cx="512" cy="512" r="292" fill="none" stroke="#E9E7E2" stroke-width="10"/>
    <path d="M512 512H780M512 512 618 758" fill="none" stroke="#E9E7E2" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g filter="url(#stroke-lift)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M780 512 A268 268 0 1 0 618 758" stroke="#93A27D" stroke-width="52"/>
    <path d="M512 512H780" stroke="#2C2C2C" stroke-width="52"/>
    <path d="M512 512 618 758" stroke="#2C2C2C" stroke-width="52"/>
  </g>

  <g filter="url(#stroke-lift)">
    <circle cx="512" cy="512" r="48" fill="#F8F7F6"/>
    <circle cx="512" cy="512" r="38" fill="#2C2C2C"/>
    <circle cx="780" cy="512" r="48" fill="#F8F7F6"/>
    <circle cx="618" cy="758" r="48" fill="#F8F7F6"/>
    <circle cx="780" cy="512" r="34" fill="#93A27D"/>
    <circle cx="618" cy="758" r="34" fill="#93A27D"/>
  </g>
</svg>
